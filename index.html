<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة البراند الذكية</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .logo { width: 100px; height: 100px; border-radius: 50%; background: #ddd; margin: auto; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        h1 { font-size: 22px; color: #333; margin: 15px 0 5px 0; }
        p { color: #666; font-size: 14px; margin-bottom: 25px; }
        .btn { display: flex; align-items: center; justify-content: center; background: #007bff; color: white; text-decoration: none; padding: 12px; margin: 10px 0; border-radius: 8px; font-weight: bold; font-size: 16px; transition: 0.2s; }
        .btn:hover { opacity: 0.9; }
        .btn-google { background: #ea4335; }
        .btn-instapay { background: #6f42c1; }
        .btn-wallet { background: #28a745; }
        .btn-whatsapp { background: #25d366; }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">لوجو البراند</div>
    <h1>اسم المحل أو الشركة</h1>
    <p>تابعنا، قيّمنا، أو ادفع بكل سهولة في خطوة واحدة</p>

    <!-- روابط السوشيال ميديا والتقييم -->
    <a href="رابط_جوجل_هنا" class="btn btn-google" target="_blank">⭐ قيّمنا على Google</a>
    <a href="رابط_واتساب_هنا" class="btn btn-whatsapp" target="_blank">💬 تواصل عبر الواتساب</a>
    <a href="رابط_فيسبوك_هنا" class="btn">🔵 صفحة الفيسبوك</a>
    <a href="رابط_انستجرام_هنا" class="btn" style="background: #e1306c;">📸 حساب إنستجرام</a>

    <!-- روابط الدفع -->
    <a href="رابط_صورة_QR_انستاباي" class="btn btn-instapay" target="_blank">💸 الدفع عبر InstaPay</a>
    <a href="رابط_صورة_ارقام_المحافظ" class="btn btn-wallet" target="_blank">📱 دفع كاش (المحافظ الإلكترونية)</a>
</div>

</body>
</html>
